spring:
  application:
    name: gateway_server
  cloud:
    gateway:
      server:
        webmvc:
          routes: # <-- Tam olarak webmvc'nin altına, iki boşluk içeriden başlamalı!
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/**
            - id: cart_service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/carts/**
            - id: order_service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true